name: Build Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build release
        run: |
          for i in 1 2 3; do
            bash build_release.sh && break
            [ $i -lt 3 ] && echo "Attempt $i failed, retrying in 15s..." && sleep 15
          done

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            gh release upload "${{ github.event.release.tag_name }}" release/*.zip --clobber && break
            [ $i -lt 3 ] && echo "Attempt $i failed, retrying in 15s..." && sleep 15
          done
