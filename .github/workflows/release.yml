name: Build Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build release
        run: |
          for ($i = 1; $i -le 3; $i++) {
            $ErrorActionPreference = 'Continue'
            powershell -File build_release.ps1
            $ec = $LASTEXITCODE
            $ErrorActionPreference = 'Stop'
            if ($ec -eq 0) { exit 0 }
            if ($i -lt 3) {
              Write-Host "Attempt $i failed (exit $ec), retrying in 15s..."
              Start-Sleep 15
            }
          }
          exit 1
        shell: pwsh

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            $ErrorActionPreference = 'Continue'
            gh release upload "${{ github.event.release.tag_name }}" release/*.zip --clobber
            $ec = $LASTEXITCODE
            $ErrorActionPreference = 'Stop'
            if ($ec -eq 0) { exit 0 }
            if ($i -lt 3) {
              Write-Host "Attempt $i failed, retrying in 15s..."
              Start-Sleep 15
            }
          }
          exit 1
